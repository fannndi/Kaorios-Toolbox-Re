# Farewell native property service configuration.
# - Read at boot and re-applied periodically by /system/bin/farewelld.
# - Format: key=value, '#' starts a comment, values keep internal spaces.
# - Only existing properties are updated (missing ones are skipped) and values
#   must be non-empty and shorter than 92 characters.
# - ro.boot.* / ro.secureboot.* cannot be set from build.prop; this file is the
#   only supported way to override them.
# The Toolbox app writes an extended version of this file into its flashable zip
# (system/etc/farewell/props.conf) with the current PIF values.

# Boot loader / verified boot state
ro.boot.verifiedbootstate=green
ro.boot.flash.locked=1
ro.boot.vbmeta.device_state=locked
ro.boot.veritymode=enforcing
ro.boot.warranty_bit=0
ro.secureboot.lockstate=locked

# Build flags
ro.adb.secure=1
ro.debuggable=0
ro.secure=1
ro.warranty_bit=0
sys.oem_unlock_allowed=0

# Daemon status placeholder (updated at runtime, also written by build.prop)
sys.pfix_status=pending
